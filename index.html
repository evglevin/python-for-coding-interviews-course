<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Python for Coding Interviews — Interactive Course</title>
    <meta
      name="description"
      content="A fast, interactive Python crash course to prepare for coding interviews: 40 hands-on lessons covering the essential syntax, data structures, and idioms."
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Evgeny Levin" />
    <meta name="theme-color" content="#161618" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)" />

    <link rel="canonical" href="https://python.evgenylevin.com/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Python for Coding Interviews" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Python for Coding Interviews — Interactive Course" />
    <meta
      property="og:description"
      content="A fast, interactive Python crash course to prepare for coding interviews: 40 hands-on lessons covering the essential syntax, data structures, and idioms."
    />
    <meta property="og:url" content="https://python.evgenylevin.com/" />
    <meta property="og:image" content="https://python.evgenylevin.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Python for Coding Interviews — Interactive crash course with 40 hands-on lessons covering essential Python syntax, data structures, and idioms in the browser"
    />

    <!-- X / Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Python for Coding Interviews — Interactive Course" />
    <meta
      name="twitter:description"
      content="A fast, interactive Python crash course to prepare for coding interviews: 40 hands-on lessons covering the essential syntax, data structures, and idioms."
    />
    <meta name="twitter:image" content="https://python.evgenylevin.com/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Python for Coding Interviews — Interactive crash course with 40 hands-on lessons covering essential Python syntax, data structures, and idioms in the browser"
    />

    <script>
      // Runs before first paint. Applies the saved theme (main.tsx keeps it in sync after) and marks
      // that JS is on, so the crawler-only pre-rendered HTML in #root never flashes before React mounts.
      (function () {
        var root = document.documentElement;
        var theme = null;
        try {
          theme = localStorage.getItem('py_interviews_theme_v1');
        } catch (e) {}
        root.classList.toggle('dark', theme !== 'light');
        root.classList.add('js');
      })();
    </script>
    <style>
      .js [data-prerender] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
